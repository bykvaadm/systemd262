name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Логин и токен Docker Hub — секреты репозитория. Секреты нельзя
  # проверять в if:, поэтому логин проброшен в env, а там проверять можно.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  HUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/systemd262

jobs:
  build:
    # Каждая архитектура собирается нативно: компиляция systemd под QEMU
    # заняла бы в разы больше времени.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      pushed: ${{ steps.push.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Platform slug
        run: |
          p=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${p//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build for tests
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: systemd262:static
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Scenarios
        run: NO_BUILD=1 ./scenarios/run.sh

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Слои уже в кеше после шага тестов, здесь только выгрузка.
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.HUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: steps.push.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.push.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: steps.push.outcome == 'success'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Склеивает образы архитектур в один мультиплатформенный тег.
    needs: build
    if: needs.build.outputs.pushed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.HUB_IMAGE }}
          tags: |
            type=raw,value=262,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # списки -t и дайджестов должны разбиться на аргументы
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.HUB_IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect '${{ env.HUB_IMAGE }}:${{ steps.meta.outputs.version }}'
